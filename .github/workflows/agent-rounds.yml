name: agent rounds

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (GitHub may start it a few minutes late)
  workflow_dispatch:
    inputs:
      only:
        description: "Run just this agent id (leave empty for all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: agent-rounds
  cancel-in-progress: false

jobs:
  round:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDKs
        run: pip install --quiet anthropic openai google-genai pydantic

      - name: Run one round for each enabled agent
        env:
          KEY_A: ${{ secrets.KEY_A }}
          KEY_B: ${{ secrets.KEY_B }}
          KEY_C: ${{ secrets.KEY_C }}
          KEY_D: ${{ secrets.KEY_D }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          git config user.name "agent-rounds"
          git config user.email "agents@users.noreply.github.com"
          if [ -n "$ONLY" ]; then
            python automation/round.py --only "$ONLY"
          else
            python automation/round.py
          fi

      - name: Push the agents' commits
        run: |
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push --quiet origin HEAD:main && exit 0
            sleep 5
          done
          echo "push failed after 3 tries" && exit 1
